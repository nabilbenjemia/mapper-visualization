services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - /mnt/data/results:/mnt/data/results
      - /mnt/data/tiles:/mnt/data/tiles

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  admin-frontend:
    build: ./admin-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
